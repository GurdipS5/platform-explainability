apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: explain-deny-latest-tag
spec:
  validationFailureAction: Enforce
  rules:
    - name: no-latest-tag
      match:
        resources:
          kinds:
            - Pod
      validate:
        message: "Image tag 'latest' is not allowed for production workloads"
        pattern:
          spec:
            containers:
              - image: "!*:latest"
